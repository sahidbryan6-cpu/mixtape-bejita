<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Canciones para ti</title>
  <meta name="description" content="Un mixtape para Bejita">
  <meta name="theme-color" content="#EFE5D3">
  <!-- Vista previa para WhatsApp y redes (los rastreadores no ejecutan JS, por eso va aquí) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Canciones para ti 💌">
  <meta property="og:description" content="Un mixtape para Bejita">
  <meta property="og:image" content="img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23F7A8C0' d='M16 28.5S3.5 21 3.5 11.8A6.8 6.8 0 0 1 16 8.1a6.8 6.8 0 0 1 12.5 3.7C28.5 21 16 28.5 16 28.5z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-screen="LOADING">

  <!-- MAIN: montada desde el inicio, debajo de todo -->
  <main class="main" id="main" inert aria-hidden="true">
    <div class="room" id="room" aria-hidden="true"></div>
    <section class="card" id="card" aria-labelledby="title">
      <div class="card__inner">
        <span class="arc arc--tl" aria-hidden="true"></span>
        <p class="eyebrow" id="eyebrow"></p>
        <h1 class="title" id="title"></h1>

        <div class="cassette" id="cassette" role="button" tabindex="0" aria-pressed="false">
          <!-- capas: interior (cinta) → carretes que giran → carcasa con el vidrio de la ventana -->
          <img class="cassette__inside" id="cassetteInside" alt="" decoding="async" draggable="false">
          <img class="reel reel--l" id="reelL" alt="" decoding="async" draggable="false">
          <img class="reel reel--r" id="reelR" alt="" decoding="async" draggable="false">
          <img class="cassette__img" id="cassetteImg" alt="" decoding="async" draggable="false">
        </div>

        <div class="bottom">
          <div class="tracks">
            <ol class="tracklist" id="tracklist"></ol>
            <p class="status" id="status" aria-live="polite"></p>
          </div>
          <div class="side">
            <aside class="note" aria-labelledby="noteLabel">
              <span class="washi" aria-hidden="true"></span>
              <p class="label note__label" id="noteLabel"></p>
              <div class="note__body" id="noteBody"></div>
            </aside>
          </div>
        </div>

        <!-- Secciones de amor: razones, futuro y promesa (se construyen desde config.js) -->
        <div class="love" id="love"></div>

        <div class="card__footer">
          <button class="finish" id="finish" type="button"></button>
        </div>
        <span class="arc arc--br" aria-hidden="true"></span>
      </div>
    </section>
  </main>

  <!-- ENVELOPE -->
  <section class="envelope" id="envelope" role="button" tabindex="-1">
    <div class="envelope__wrap" id="envWrap">
      <div class="envelope__float" id="envFloat">
        <img class="envelope__img envelope__img--closed" id="envClosed" alt="" decoding="async" draggable="false">
        <img class="envelope__img envelope__img--open" id="envOpen" alt="" decoding="async" draggable="false">
      </div>
    </div>
    <p class="tap tap--open" id="tapOpen" aria-hidden="true"></p>
  </section>

  <!-- Muro de flores (se crea y se destruye desde JS) -->
  <div class="wall-host" id="wallHost"></div>

  <!-- PANEL "Hay más aquí" -->
  <div class="panel" id="panel" role="dialog" aria-modal="true" hidden>
    <div class="panel__scroll" id="panelScroll">
      <button class="letter-card" id="letterCard" type="button">
        <span class="label letter-card__label" id="letterLabel"></span>
        <span class="letter-card__title" id="letterTitle"></span>
        <span class="letter-card__sub" id="letterSub"></span>
        <span class="letter-card__from" id="letterFrom"></span>
      </button>

      <div class="voice" id="voice" hidden>
        <button class="voice__btn" id="voiceBtn" type="button">
          <svg class="i-play" viewBox="0 0 10 12" width="12" height="14" aria-hidden="true"><path d="M0 0L10 6L0 12Z" fill="currentColor"/></svg>
          <svg class="i-pause" viewBox="0 0 10 12" width="12" height="14" aria-hidden="true"><rect width="3.4" height="12" rx="1" fill="currentColor"/><rect x="6.6" width="3.4" height="12" rx="1" fill="currentColor"/></svg>
        </button>
        <span class="voice__text">
          <span class="voice__title" id="voiceTitle"></span>
          <span class="voice__hint" id="voiceHint"></span>
        </span>
        <span class="wave" id="wave" aria-hidden="true"></span>
        <span class="voice__time" id="voiceTime">0:15</span>
      </div>

      <section class="bouquet" id="bouquet" aria-labelledby="bouquetTitle">
        <h2 class="bouquet__title" id="bouquetTitle"></h2>
        <p class="label bouquet__from" id="bouquetFrom"></p>
        <div class="bouquet__rise" id="bouquetRise">
          <img class="bouquet__img" id="bouquetImg" alt="" decoding="async" draggable="false">
        </div>
      </section>

      <section class="player" id="player">
        <img class="player__cover" id="playerCover" alt="" decoding="async">
        <div class="player__text">
          <p class="player__title" id="playerTitle"></p>
          <p class="player__artist" id="playerArtist"></p>
          <div class="player__progress">
            <div class="seek" id="seek" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
              <span class="seek__fill" id="seekFill"></span>
            </div>
            <span class="player__time" id="playerTime">0:00</span>
          </div>
        </div>
        <div class="player__controls">
          <svg class="player__icon" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M6 10.4l2.6 2.5L14 7.6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="player__icon" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><circle cx="4" cy="10" r="1.7" fill="#fff"/><circle cx="10" cy="10" r="1.7" fill="#fff"/><circle cx="16" cy="10" r="1.7" fill="#fff"/></svg>
          <button class="player__play" id="playerPlay" type="button">
            <svg class="i-play" viewBox="0 0 10 12" width="11" height="13" aria-hidden="true"><path d="M0 0L10 6L0 12Z" fill="currentColor"/></svg>
            <svg class="i-pause" viewBox="0 0 10 12" width="11" height="13" aria-hidden="true"><rect width="3.4" height="12" rx="1" fill="currentColor"/><rect x="6.6" width="3.4" height="12" rx="1" fill="currentColor"/></svg>
          </button>
        </div>
        <svg class="player__badge" viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"><path d="M5 10.6V2.4l7-1.4v8" fill="none" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/><ellipse cx="3.4" cy="10.8" rx="2" ry="1.6" fill="#fff"/><ellipse cx="10.4" cy="9.4" rx="2" ry="1.6" fill="#fff"/></svg>
      </section>

      <div class="video" id="video" hidden></div>
    </div>
  </div>

  <!-- Letra en español, sincronizada con la canción (se llena en js/letra.js) -->
  <section class="lyrics" id="lyrics" aria-live="off">
    <svg class="lyrics__note" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 17.5V5.2l10-2v11.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><ellipse cx="6.6" cy="17.6" rx="2.9" ry="2.3" fill="currentColor"/><ellipse cx="16.6" cy="15" rx="2.9" ry="2.3" fill="currentColor"/></svg>
    <p class="lyrics__text" id="lyricsText"></p>
    <p class="lyrics__echo" id="lyricsEcho"></p>
    <span class="lyrics__bar" id="lyricsBar" aria-hidden="true"></span>
  </section>

  <!-- Flotantes -->
  <button class="heart" id="heart" type="button" aria-haspopup="dialog" aria-controls="panel" aria-expanded="false">
    <svg viewBox="0 0 32 32" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M16 28.5S3.5 21 3.5 11.8A6.8 6.8 0 0 1 16 8.1a6.8 6.8 0 0 1 12.5 3.7C28.5 21 16 28.5 16 28.5z"/></svg>
  </button>
  <button class="pill" id="pill" type="button" aria-haspopup="dialog" aria-controls="panel"></button>
  <div class="help" id="help">
    <div class="help__bubble" id="helpBubble" role="tooltip" hidden></div>
    <button class="help__btn" id="helpBtn" type="button" aria-expanded="false" aria-controls="helpBubble"></button>
  </div>

  <!-- Modal de la carta -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal__overlay" id="modalOverlay"></div>
    <article class="modal__sheet" id="modalSheet">
      <button class="modal__close" id="modalClose" type="button">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <h2 class="modal__title" id="modalTitle"></h2>
      <div class="modal__body" id="modalBody"></div>
      <p class="modal__sign" id="modalSign"></p>
    </article>
  </div>

  <script src="js/config.js"></script>
  <script src="js/letra.js"></script>
  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
